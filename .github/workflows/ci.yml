# Site: typecheck + production build. Server: typecheck + tests. Node version
# comes from .nvmrc, which is kept on the same major as both Dockerfiles.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test

  # Production deploy: Dokploy pulls main and rebuilds docker-compose.yml when
  # its webhook is called. Only after every check passed on a push to main.
  # DOKPLOY_WEBHOOK_URL is a repository secret (service → Deployments → Webhook URL).
  deploy:
    runs-on: ubuntu-latest
    needs: [site, server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger Dokploy deploy
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DOKPLOY_WEBHOOK_URL secret is not set; skipping deploy."
            exit 0
          fi
          response=$(curl --fail --silent --show-error -X POST "$WEBHOOK_URL" \
            -H "content-type: application/json" \
            -H "x-github-event: push" \
            -d "{\"ref\":\"${GITHUB_REF}\",\"after\":\"${GITHUB_SHA}\"}")
          echo "Dokploy: $response"
          case "$response" in
            *"Not Match"*|*"not found"*|*"error"*)
              echo "::error::Dokploy did not start a deploy: $response"; exit 1 ;;
          esac
