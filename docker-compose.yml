# Production stack for revault.nl: the Next.js site, the API (server/) and
# Postgres. Traefik (Dokploy) routes revault.nl → site and api.revault.nl →
# server; the browser calls the API cross-origin (CORS_ORIGINS).
services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.revault.nl}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://revault.nl}
    environment:
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://revault.nl}
    labels:
      # Traefik compress middleware (gzip/brotli/zstd on Traefik v3), attach
      # `revault-compress@docker` to the router in Dokploy to activate it.
      - traefik.http.middlewares.revault-compress.compress=true
    restart: unless-stopped
    networks:
      - dokploy-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://revault:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/revault
      - CORS_ORIGINS=${NEXT_PUBLIC_SITE_URL:-https://revault.nl}
      - ADMIN_SERVICE_TOKEN=${ADMIN_SERVICE_TOKEN:?set ADMIN_SERVICE_TOKEN}
      - INTAKE_EMAIL=${INTAKE_EMAIL:?set INTAKE_EMAIL}
      - MAIL_FROM=${MAIL_FROM:-Revault <noreply@revault.nl>}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      # One hop: Traefik.
      - TRUST_PROXY=1
    healthcheck:
      # Busybox wget ships with alpine; /health is the API's liveness route.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dokploy-network
      - internal

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=revault
      - POSTGRES_USER=revault
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revault -d revault"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

volumes:
  pgdata:

networks:
  # Dokploy's proxy network; Traefik routes revault.nl / api.revault.nl here.
  dokploy-network:
    external: true
  internal:
